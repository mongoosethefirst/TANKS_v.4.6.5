name: Build TANKS V4.6.5

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: TANKS_V4.6.5_Windows
          - os: macos-latest
            artifact: TANKS_V4.6.5_macOS
          - os: ubuntu-latest
            artifact: TANKS_V4.6.5_Linux

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pygame-ce pyinstaller

      - name: Show files
        shell: bash
        run: |
          find . -maxdepth 3 -type f | sort

      - name: Build TANKS
        run: >
          python -m PyInstaller
          --noconfirm
          --clean
          --windowed
          --onedir
          --name TANKS_V4.6.5
          --paths "tanks/files"
          --add-data "tanks/images:tanks/images"
          --add-data "tanks/fonts:tanks/fonts"
          --hidden-import new
          --hidden-import join
          --hidden-import play_host
          --hidden-import play_client
          --hidden-import server
          --hidden-import network
          --hidden-import game_client_base
          "tanks/files/home_page.py"

      - name: Upload Windows build
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: TANKS_V4.6.5_Windows
          path: dist/TANKS_V4.6.5/
          if-no-files-found: error

      - name: Upload Linux build
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: TANKS_V4.6.5_Linux
          path: dist/TANKS_V4.6.5/
          if-no-files-found: error

      - name: Upload macOS build
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: TANKS_V4.6.5_macOS
          path: |
            dist/TANKS_V4.6.5/
            dist/TANKS_V4.6.5.app
          if-no-files-found: error
